<!-- ================================
     CONTACT SECTION
     ================================ -->
<section id="contact" class="py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
  <div class="text-center mb-16" data-aos="fade-up">
    <h2 class="text-4xl sm:text-5xl font-heading font-bold mb-4">
      Contacta<span class="gradient-text">me</span>
    </h2>
    <p class="text-white/50 max-w-2xl mx-auto">
      Tienes un proyecto en mente? Hablemos!
    </p>
  </div>

  <div class="grid md:grid-cols-2 gap-12">

    <!-- Contact Info -->
    <div data-aos="fade-right" data-aos-delay="200">
      <h3 class="text-2xl font-heading font-bold mb-6">Informacion de contacto</h3>

      <div class="space-y-6">
        <!-- Email -->
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-lg bg-primary/20 flex items-center justify-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </div>
          <div>
            <p class="text-white/50 text-sm">Email</p>
            <a href="mailto:tu@email.com" class="text-white hover:text-primary transition-colors">tu@email.com</a>
          </div>
        </div>

        <!-- Phone -->
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-lg bg-secondary/20 flex items-center justify-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </div>
          <div>
            <p class="text-white/50 text-sm">Telefono</p>
            <a href="tel:+1234567890" class="text-white hover:text-secondary transition-colors">+123 456 7890</a>
          </div>
        </div>

        <!-- Location -->
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-lg bg-cyan-400/20 flex items-center justify-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-cyan-400"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div>
            <p class="text-white/50 text-sm">Ubicacion</p>
            <p class="text-white">Ciudad, Pais</p>
          </div>
        </div>
      </div>

      <!-- Social Links -->
      <div class="mt-8">
        <p class="text-white/50 text-sm mb-4">Sigueme en redes</p>
        <div class="flex gap-3">
          <a href="https://github.com/" target="_blank" class="p-3 glass-card hover:border-primary/50 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
          </a>
          <a href="https://linkedin.com/" target="_blank" class="p-3 glass-card hover:border-primary/50 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>
          </a>
          <a href="https://wa.me/1234567890" target="_blank" class="p-3 glass-card hover:border-primary/50 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </a>
        </div>
      </div>
    </div>

    <!-- Contact Form -->
    <div data-aos="fade-left" data-aos-delay="300"
      x-data="{
        nombre: '',
        email: '',
        mensaje: '',
        enviado: false,
        enviar() {
          if (this.nombre && this.email && this.mensaje) {
            this.enviado = true;
            setTimeout(() => { this.enviado = false }, 3000);
            this.nombre = '';
            this.email = '';
            this.mensaje = '';
          }
        }
      }">
      <form @submit.prevent="enviar()" class="space-y-6">
        <div>
          <label class="block text-white/70 text-sm mb-2">Nombre</label>
          <input type="text" class="form-input" placeholder="Tu nombre"
            x-model="nombre" required>
        </div>
        <div>
          <label class="block text-white/70 text-sm mb-2">Email</label>
          <input type="email" class="form-input" placeholder="tu@email.com"
            x-model="email" required>
        </div>
        <div>
          <label class="block text-white/70 text-sm mb-2">Mensaje</label>
          <textarea class="form-input h-32 resize-none" placeholder="Escribe tu mensaje..."
            x-model="mensaje" required></textarea>
        </div>

        <button type="submit" class="btn-glow w-full text-white relative z-10"
          :class="enviado && 'bg-green-500'">
          <span x-show="!enviado">Enviar Mensaje</span>
          <span x-show="enviado">Mensaje Enviado!</span>
        </button>
      </form>
    </div>
  </div>
</section>
