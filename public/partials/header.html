<!-- ================================
     HEADER - Navbar Dinámico
     Tailwind + Alpine.js + GSAP + Lucide
     ================================ -->
<div x-data="header" @keydown.escape.window="isOpen = false">

  <header id="navbar" class="fixed top-0 left-0 w-full z-50 text-fg p-4"
    :class="scrolled ? 'py-1.5 bg-nav/85 md:bg-transparent' : 'py-1.5 bg-transparent'">

    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between ">

      <!-- Logo -->
      <a href="#hero"
        class="nav-link text-sm font-medium transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4 rounded"
        id="nav-logo">
        <img src="/img/logopor.png" alt="Kevin Logo" width="181" height="122" decoding="async" class="logo-img h-12 md:h-15 w-auto" />
      </a>

      <!-- Desktop Menu -->
      <ul class="hidden md:flex items-center bg-nav rounded-full border border-line px-6 py-3 gap-5 lg:px-10 lg:gap-9"
        id="nav-links">
        <li>
          <a href="#hero"
            class="nav-link text-sm font-medium transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4 rounded"
            :class="currentSection === 'hero' ? 'text-primary' : 'text-fg hover:text-primary'">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="inline-block mr-1.5 -mt-0.5">
              <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
              <path
                d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            </svg>
            Inicio
          </a>
        </li>
        <li>
          <a href="#about"
            class="nav-link text-sm font-medium transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4 rounded"
            :class="currentSection === 'about' ? 'text-primary' : 'text-muted hover:text-primary'">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="inline-block mr-1.5 -mt-0.5">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Sobre mi
          </a>
        </li>
        <li>
          <a href="#skills"
            class="nav-link text-sm font-medium transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4 rounded"
            :class="currentSection === 'skills' ? 'text-primary' : 'text-muted hover:text-primary'">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="inline-block mr-1.5 -mt-0.5">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            Skills
          </a>
        </li>
        <li>
          <a href="#projects"
            class="nav-link text-sm font-medium transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4 rounded"
            :class="currentSection === 'projects' ? 'text-primary' : 'text-muted hover:text-primary'">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="inline-block mr-1.5 -mt-0.5">
              <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              <rect width="20" height="14" x="2" y="6" rx="2"></rect>
            </svg>
            Proyectos
          </a>
        </li>
        <li>
          <a href="#contact"
            class="nav-link text-sm font-medium transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4 rounded"
            :class="currentSection === 'contact' ? 'text-primary' : 'text-muted hover:text-primary'">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="inline-block mr-1.5 -mt-0.5">
              <rect width="20" height="16" x="2" y="4" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            Contacto
          </a>
        </li>
      </ul>

      <!-- Dark Mode Toggle -->
      <button
        class="p-2 text-strong hover:text-primary hover:rotate-45 transition-all duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4 rounded"
        @click="$store.theme.toggle()" aria-label="Toggle dark mode">
        <template x-if="$store.theme.theme === 'dark'">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
        </template>
        <template x-if="$store.theme.theme !== 'dark'">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </template>
      </button>

      <!-- Hamburger (mobile) -->
      <button type="button" x-ref="hamburger"
        class="md:hidden p-2 text-strong hover:text-primary transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4 rounded"
        @click="isOpen = !isOpen" :aria-expanded="isOpen.toString()" aria-controls="mobile-menu"
        aria-label="Abrir menú de navegación">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="6" y2="6" />
          <line x1="4" x2="20" y1="12" y2="12" />
          <line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      </button>

    </nav>
  </header>

  <!-- Overlay -->
  <div x-show="isOpen" x-cloak @click="isOpen = false" aria-hidden="true"
    x-transition:enter="transition-opacity duration-300 ease-out"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition-opacity duration-300 ease-in"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 z-55 bg-black/60 backdrop-blur-sm md:hidden"></div>

  <!-- Mobile Menu Panel (slide from left) -->
  <div id="mobile-menu" x-ref="mobilePanel" x-show="isOpen" x-cloak role="dialog" aria-modal="true"
    aria-label="Menú de navegación"
    x-transition:enter="transition-all duration-300 ease-out"
    x-transition:enter-start="-translate-x-full"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transition-all duration-300 ease-in"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="-translate-x-full"
    class="fixed inset-y-0 left-0 z-60 w-72 max-w-[85%] bg-nav border-r border-line flex flex-col md:hidden shadow-2xl">

    <!-- Panel header -->
    <div class="flex items-center justify-between p-4 border-b border-line">
      <a href="#hero" @click="isOpen = false" class="flex items-center" aria-label="Ir al inicio">
        <img src="/img/logopor.png" alt="Kevin Logo" width="181" height="122" decoding="async"
          class="logo-img h-10 w-auto" />
      </a>
      <button type="button" @click="isOpen = false" aria-label="Cerrar menú"
        class="p-2 text-strong hover:text-primary transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4 rounded">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>

    <!-- Panel links -->
    <nav class="flex-1 overflow-y-auto p-4">
      <ul class="space-y-1">
        <li>
          <a href="#hero" @click="isOpen = false"
            class="nav-link block py-3 px-4 rounded-lg text-base font-medium transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4"
            :class="currentSection === 'hero' ? 'text-primary' : 'text-fg hover:text-primary'">
            Inicio
          </a>
        </li>
        <li>
          <a href="#about" @click="isOpen = false"
            class="nav-link block py-3 px-4 rounded-lg text-base font-medium transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4"
            :class="currentSection === 'about' ? 'text-primary' : 'text-muted hover:text-primary'">
            Sobre mi
          </a>
        </li>
        <li>
          <a href="#skills" @click="isOpen = false"
            class="nav-link block py-3 px-4 rounded-lg text-base font-medium transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4"
            :class="currentSection === 'skills' ? 'text-primary' : 'text-muted hover:text-primary'">
            Skills
          </a>
        </li>
        <li>
          <a href="#projects" @click="isOpen = false"
            class="nav-link block py-3 px-4 rounded-lg text-base font-medium transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4"
            :class="currentSection === 'projects' ? 'text-primary' : 'text-muted hover:text-primary'">
            Proyectos
          </a>
        </li>
        <li>
          <a href="#contact" @click="isOpen = false"
            class="nav-link block py-3 px-4 rounded-lg text-base font-medium transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-4"
            :class="currentSection === 'contact' ? 'text-primary' : 'text-muted hover:text-primary'">
            Contacto
          </a>
        </li>
      </ul>
    </nav>

    <!-- Panel footer -->
    <div class="p-4 border-t border-line space-y-4">
      <a href="#contact" @click="isOpen = false"
        class="btn-glow block text-center text-black font-semibold">
        Contactar
      </a>
      <div class="flex gap-2 justify-center">
        <a href="https://github.com/CarrilloTK" target="_blank" rel="noopener noreferrer" title="GitHub"
          aria-label="GitHub"
          class="social-icon p-3 text-muted hover:text-primary transition-colors duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 1024 1024" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M8 0C3.58 0 0 3.58 0 8C0 11.54 2.29 14.53 5.47 15.59C5.87 15.66 6.02 15.42 6.02 15.21C6.02 15.02 6.01 14.39 6.01 13.72C4 14.09 3.48 13.23 3.32 12.78C3.23 12.55 2.84 11.84 2.5 11.65C2.22 11.5 1.82 11.13 2.49 11.12C3.12 11.11 3.57 11.7 3.72 11.94C4.44 13.15 5.59 12.81 6.05 12.6C6.12 12.08 6.33 11.73 6.56 11.53C4.78 11.33 2.92 10.64 2.92 7.58C2.92 6.71 3.23 5.99 3.74 5.43C3.66 5.23 3.38 4.41 3.82 3.31C3.82 3.31 4.49 3.1 6.02 4.13C6.66 3.95 7.34 3.86 8.02 3.86C8.7 3.86 9.38 3.95 10.02 4.13C11.55 3.09 12.22 3.31 12.22 3.31C12.66 4.41 12.38 5.23 12.3 5.43C12.81 5.99 13.12 6.7 13.12 7.58C13.12 10.65 11.25 11.33 9.47 11.53C9.76 11.78 10.01 12.26 10.01 13.01C10.01 14.08 10 14.94 10 15.21C10 15.42 10.15 15.67 10.55 15.59C13.71 14.53 16 11.53 16 8C16 3.58 12.42 0 8 0Z"
              transform="scale(64)" fill="currentColor" />
          </svg>
        </a>
        <a href="https://www.linkedin.com/in/kevincarrillo160997/" target="_blank" rel="noopener noreferrer"
          title="LinkedIn" aria-label="LinkedIn"
          class="social-icon p-3 text-muted hover:text-[#0A66C2] transition-colors duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" preserveAspectRatio="xMidYMid"
            viewBox="0 0 256 256" fill="none">
            <path
              d="M218.123 218.127h-37.931v-59.403c0-14.165-.253-32.4-19.728-32.4-19.756 0-22.779 15.434-22.779 31.369v60.43h-37.93V95.967h36.413v16.694h.51a39.907 39.907 0 0 1 35.928-19.733c38.445 0 45.533 25.288 45.533 58.186l-.016 67.013ZM56.955 79.27c-12.157.002-22.014-9.852-22.016-22.009-.002-12.157 9.851-22.014 22.008-22.016 12.157-.003 22.014 9.851 22.016 22.008A22.013 22.013 0 0 1 56.955 79.27m18.966 138.858H37.95V95.967h37.97v122.16ZM237.033.018H18.89C8.58-.098.125 8.161-.001 18.471v219.053c.122 10.315 8.576 18.582 18.89 18.474h218.144c10.336.128 18.823-8.139 18.966-18.474V18.454c-.147-10.33-8.635-18.588-18.966-18.453"
              fill="currentColor" />
          </svg>
        </a>

      </div>
    </div>
  </div>

</div>
