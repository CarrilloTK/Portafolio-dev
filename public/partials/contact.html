<!-- ================================
     CONTACT SECTION
     ================================ -->
<section id="contact" class="py-15 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
  <div class="text-center mb-16" data-reveal>
    <h2 class="gradient-text text-4xl sm:text-6xl font-heading font-bold mb-4">
      Contacta<span class="gradient-text">me</span>
    </h2>
    <p class="text-white/50 max-w-2xl mx-auto">
      Tienes un proyecto en mente? Hablemos!
    </p>
  </div>

  <div class="grid md:grid-cols-2 gap-12">

    <!-- Contact Info -->
    <div data-reveal data-reveal-delay="200">
      <h3 class="text-2xl gradient-text font-heading font-bold mb-6">Informacion de contacto</h3>

      <div class="space-y-6">
        <!-- Email -->
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-lg bg-primary/20 flex items-center justify-center ">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="text-amber-600">
              <rect width="20" height="16" x="2" y="4" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
          </div>
          <div>
            <p class="text-white/50 text-sm">Email</p>
            <a href="mailto:kevincarrillo1609@gmail.com"
              class="text-white hover:text-amber-400 transition-colors">kevincarrillo1609@gmail.com</a>
          </div>
        </div>

        <!-- Phone -->
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-lg bg-secondary/20 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="text-amber-600">
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
            </svg>
          </div>
          <div>
            <p class="text-white/50 text-sm">Telefono</p>
            <a href="tel:+1234567890" class="text-white hover:text-amber-400 transition-colors">+591 75614633</a>
          </div>
        </div>

        <!-- Location -->
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-lg flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="text-amber-600">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
          </div>
          <div>
            <p class="text-white/50 text-sm">Ubicacion</p>
            <p class="text-white">Santa Cruz de la Sierra, Bolivia</p>
          </div>
        </div>
      </div>

    </div>

    <!-- Contact Form -->
    <div data-reveal data-reveal-delay="300" x-data="{
        nombre: '',
        email: '',
        mensaje: '',
        estado: 'idle',
        errorMsg: '',
        async enviar() {
          if (!this.nombre || !this.email || !this.mensaje) return;
          this.estado = 'enviando';
          try {
            const res = await fetch('https://formspree.io/f/xyeggorb', {
              method: 'POST',
              headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: this.nombre, _replyto: this.email, message: this.mensaje })
            });
            if (res.ok) {
              this.estado = 'enviado';
              this.nombre = '';
              this.email = '';
              this.mensaje = '';
              setTimeout(() => { this.estado = 'idle' }, 4000);
            } else {
              const data = await res.json();
              this.estado = 'error';
              this.errorMsg = data.errors?.map(e => e.message).join(', ') || 'Error al enviar. Inténtalo de nuevo.';
            }
          } catch (e) {
            console.error('Formspree error:', e)
            this.estado = 'error';
            this.errorMsg = 'No se pudo enviar. Revisa tu conexión.';
          }
        }
      }">
      <form @submit.prevent="enviar()" class="space-y-6">
        <div>
          <label class="block text-white/70 text-sm mb-2">Nombre</label>
          <input type="text" class="form-input" placeholder="Tu nombre" x-model="nombre" required>
        </div>
        <div>
          <label class="block text-white/70 text-sm mb-2">Email</label>
          <input type="email" class="form-input" placeholder="tu@email.com" x-model="email" required>
        </div>
        <div>
          <label class="block text-white/70 text-sm mb-2">Mensaje</label>
          <textarea class="form-input h-32 resize-none" placeholder="Escribe tu mensaje..." x-model="mensaje"
            required></textarea>
        </div>

        <button type="submit" class="btn-glow w-full text-black relative z-10"
          :class="estado === 'enviado' && 'bg-green-500'"
          :disabled="estado === 'enviando'">
          <span x-show="estado !== 'enviado' && estado !== 'enviando'">Enviar Mensaje</span>
          <span x-show="estado === 'enviando'">Enviando...</span>
          <span x-show="estado === 'enviado'">¡Mensaje Enviado!</span>
        </button>
        <p x-show="estado === 'error'" x-text="errorMsg"
          class="text-red-400 text-sm text-center"></p>
      </form>
    </div>
  </div>
</section>
